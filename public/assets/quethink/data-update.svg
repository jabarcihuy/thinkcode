<svg xmlns="http://www.w3.org/2000/svg" width="320" height="328" viewBox="0 0 320 328" role="img" aria-labelledby="title desc">
  <title id="title">Mengubah satu baris data dengan UPDATE</title>
  <desc id="desc">Stok buku dengan book_id 10 berubah dari 5 menjadi 6. Buku dengan book_id 20 tetap memiliki stok 0. WHERE membatasi target perubahan.</desc>
  <rect x="12" y="36" width="296" height="34" rx="8" fill="#EEECFB" fill-opacity=".5"/>
  <g font-family="sans-serif" font-size="14" fill="#25223D">
    <text x="12" y="24" font-weight="700">Sebelum · books</text>
    <text x="24" y="57">book_id 10</text><text x="224" y="57">stock: 5</text>
    <text x="24" y="91">book_id 20</text><text x="224" y="91">stock: 0</text>
  </g>
  <path d="M12 104H308" stroke="#DEDCE9"/>
  <path d="M160 114V134M154 128L160 134L166 128" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <rect x="12" y="146" width="296" height="68" rx="12" fill="#F1F0F7"/>
  <g font-family="ui-monospace,monospace" font-size="12" fill="#4F46E5"><text x="24" y="172">UPDATE books SET stock = 6</text><text x="24" y="195">WHERE book_id = 10;</text></g>
  <path d="M160 224V244M154 238L160 244L166 238" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <rect x="12" y="254" width="296" height="62" rx="12" fill="#FFF0E3"/>
  <g font-family="sans-serif" font-size="14" fill="#25223D"><text x="24" y="277" font-weight="700">Sesudah · hanya 1 baris berubah</text><text x="24" y="300">book_id 10</text><text x="224" y="300" font-weight="700">stock: 6</text></g>
</svg>
