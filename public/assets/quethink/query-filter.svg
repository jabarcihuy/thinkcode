<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420" role="img" aria-labelledby="title desc">
  <title id="title">Query menyaring data buku</title>
  <desc id="desc">Tabel books memuat tiga buku. SELECT title FROM books WHERE stock lebih besar dari nol menghasilkan Dasar Basis Data dan Pengantar SQL. Logika Data tidak dipilih karena stoknya nol.</desc>
  <rect x="12" y="12" width="296" height="168" rx="12" fill="#FFFFFF" stroke="#DEDCE9"/>
  <path d="M24 12H296Q308 12 308 24V52H12V24Q12 12 24 12" fill="#EEECFB"/>
  <rect x="13" y="52" width="294" height="42" fill="#EEECFB"/>
  <rect x="13" y="136" width="294" height="42" fill="#EEECFB"/>
  <path d="M12 52H308M12 94H308M12 136H308M245 12V180" stroke="#DEDCE9"/>
  <g font-family="sans-serif" font-size="14" fill="#25223D">
    <text x="26" y="38" font-weight="700">books · title</text><text x="258" y="38" font-weight="700">stock</text>
    <text x="26" y="79">Dasar Basis Data</text><text x="266" y="79">5</text>
    <text x="26" y="121">Logika Data</text><text x="266" y="121">0</text>
    <text x="26" y="163">Pengantar SQL</text><text x="266" y="163">2</text>
  </g>
  <path d="M160 188V208M154 202L160 208L166 202" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <rect x="12" y="220" width="296" height="66" rx="12" fill="#F1F0F7"/>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#4F46E5"><text x="26" y="245">SELECT title FROM books</text><text x="26" y="267">WHERE stock &gt; 0;</text></g>
  <path d="M160 294V314M154 308L160 314L166 308" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <rect x="12" y="326" width="296" height="82" rx="12" fill="#FFF0E3"/>
  <g font-family="sans-serif" font-size="14" fill="#25223D"><text x="26" y="350" font-weight="700">Hasil · 2 baris</text><text x="26" y="374">Dasar Basis Data</text><text x="26" y="396">Pengantar SQL</text></g>
</svg>
