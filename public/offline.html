<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>Connection lost | Quethink</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:system-ui,sans-serif;background:#f8f8fc;color:#24243b}main{max-width:360px}p{line-height:1.6;color:#55566c}h1{font-size:26px}button{min-height:48px;padding:12px 24px;background:#4f46e5;color:white;border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}select{min-height:44px;padding:8px 12px;border:1px solid #dddbea;border-radius:12px;background:white;color:#24243b;font:inherit}button:focus-visible{outline:3px solid #d78350;outline-offset:4px}</style></head>
<body><main><p>Quethink</p><h1 id="title">Connection lost</h1><p id="message">Reconnect to the internet to continue learning.</p><button id="retry" type="button" onclick="location.reload()">Try again</button><p><select aria-label="Language" id="language"><option value="en">English</option><option value="id">Indonesia</option></select></p></main><script>var l=document.getElementById("language");function setLanguage(v){document.documentElement.lang=v;document.getElementById("title").textContent=v==="id"?"Koneksi terputus":"Connection lost";document.getElementById("message").textContent=v==="id"?"Sambungkan internet untuk melanjutkan belajar.":"Reconnect to the internet to continue learning.";document.getElementById("retry").textContent=v==="id"?"Coba lagi":"Try again";document.title=document.getElementById("title").textContent+" | Quethink";l.value=v;}try{setLanguage(localStorage.getItem("quethink:language")==="id"?"id":"en");}catch(e){}l.onchange=function(){setLanguage(l.value);};</script></body></html>
